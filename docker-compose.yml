# Sobe o Postgres com a base fictícia e um Metabase vazio.
# O painel é criado depois por scripts/provisionar_metabase.py.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: painel
      POSTGRES_USER: painel
      POSTGRES_PASSWORD: painel
    ports:
      - "5432:5432"
    volumes:
      # Os arquivos rodam em ordem alfabética na primeira subida:
      # esquema, dados fictícios e as visões do painel.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U painel -d painel"]
      interval: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    volumes:
      - metabase-dados:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  metabase-dados:
